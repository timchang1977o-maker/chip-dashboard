name: Chip Dashboard Daily (Pages)

on:
  schedule:
    # TW 平日 16:10 = UTC 08:10（TAIFEX 三大法人未平倉盤後已揭露、T86 個股買賣超已出）
    - cron: "10 8 * * 1-5"
    # 傍晚 catch-up：TW 平日 20:30 = UTC 12:30。TWSE 融資餘額(MI_MARGN)常傍晚才定稿，
    # 16:10 那班（且 GHA cron 常延遲）容易漏當天融資 → 這班補抓；沒新資料就不會 commit。
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chip-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch chip data + institution rankings + regenerate HTML
        env:
          TZ: Asia/Taipei
        run: |
          python dashboard/chip_tracker.py
          python dashboard/institution_tracker.py
          python build_page.py

      - name: Commit + push（觸發 Pages 重新部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html institutions.html \
                  "chip_reports/籌碼儀表板.html" \
                  "chip_reports/籌碼儀表板_artifact.html" \
                  "chip_reports/法人買賣超.html" \
                  dashboard/chip_data.json \
                  dashboard/institution_data.json \
                  dashboard/institution_cache.json
          if git diff --staged --quiet; then
            echo "No chip changes to commit"
          else
            git commit -m "chore(chip): daily snapshot $(TZ=Asia/Taipei date +%Y-%m-%d)"
            pushed=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { pushed=1; break; }
              sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::chip push failed after 3 retries"
              exit 1
            fi
          fi
