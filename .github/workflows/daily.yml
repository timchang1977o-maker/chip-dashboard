name: Chip Dashboard Daily (Pages)

on:
  # 依各資料源「當日公布時段」分批抓（pipeline 為增量、只在有新資料時才 commit）。
  # 註：GitHub 排程只會「延遲」不會「提早」觸發，故 cron 設在最早可用時間即可，延遲也仍在公布後。
  schedule:
    # ── 盤後批（TW 16:30 = UTC 08:30）──
    # TAIFEX 期貨三大法人未平倉／台指期近月價／選擇權未平倉 約 15:00 揭露；
    # TWSE T86 三大法人買賣超個股 約 15:30–16:00 出。16:30 一次抓齊這 4 項。
    - cron: "30 8 * * 1-5"
    # ── 晚間融資批（TW 20:30 = UTC 12:30）──
    # TWSE 融資餘額 MI_MARGN「當日晚間」才定稿、時間浮動（常晚於盤後批），這班補當天融資，
    # 同時 backfill 盤後批可能還沒齊的 T86。
    - cron: "30 12 * * 1-5"
    # ── 融資晚出安全網（TW 22:30 = UTC 14:30）──
    # 融資偶爾很晚才出；20:30 沒抓到時這班再補。抓到了就沒 diff、不會重複 commit。
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chip-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch chip data + institution rankings + regenerate HTML
        env:
          TZ: Asia/Taipei
        run: |
          python dashboard/chip_tracker.py
          python dashboard/institution_tracker.py
          python build_page.py

      - name: Commit + push（觸發 Pages 重新部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html institutions.html \
                  "chip_reports/籌碼儀表板.html" \
                  "chip_reports/籌碼儀表板_artifact.html" \
                  "chip_reports/法人買賣超.html" \
                  dashboard/chip_data.json \
                  dashboard/institution_data.json \
                  dashboard/institution_cache.json
          if git diff --staged --quiet; then
            echo "No chip changes to commit"
          else
            git commit -m "chore(chip): daily snapshot $(TZ=Asia/Taipei date +%Y-%m-%d)"
            pushed=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { pushed=1; break; }
              sleep 5
            done
            if [ "$pushed" != 1 ]; then
              echo "::error::chip push failed after 3 retries"
              exit 1
            fi
          fi
